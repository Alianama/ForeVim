version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# ForeVim — Production Deployment Compose (using GHCR Images)
# Before running:
# 1. Copy .env.example to .env and configure DATABASE_URL and external variables.
# 2. Run: docker compose -f docker-compose.prod.yml up -d
# ──────────────────────────────────────────────────────────────────────────────

networks:
  forevim-net:
    driver: bridge

services:
  # ─── Backend API ────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/alianama/forevim-backend:latest
    container_name: forevim-backend
    restart: unless-stopped
    # Initializes database tables and stamp migration state, then starts API server
    command: sh -c "python init_db.py && alembic stamp head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS_STR=${ALLOWED_ORIGINS_STR:-http://localhost:3000}
    ports:
      - "8000:8000"
    networks:
      - forevim-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Frontend Dashboard ──────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/alianama/forevim-frontend:latest
    container_name: forevim-frontend
    restart: unless-stopped
    environment:
      # Browser configurations (dynamically injected into built static files at container start)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    networks:
      - forevim-net
    depends_on:
      backend:
        condition: service_healthy

