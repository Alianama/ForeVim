version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# ForeVim — Production Deployment Compose (Unified Single Image)
# Before running:
# 1. Copy .env.example to .env and configure DATABASE_URL and external variables.
# 2. Run: docker compose -f docker-compose.prod.yml up -d
# ──────────────────────────────────────────────────────────────────────────────

networks:
  forevim-net:
    driver: bridge

services:
  # ─── ForeVim (Unified Frontend, Backend, & Nginx) ───────────────────────────
  forevim:
    image: ghcr.io/alianama/forevim:latest
    container_name: forevim-app
    restart: unless-stopped
    environment:
      # 1. PostgreSQL Database Connection (Wajib menggunakan postgresql+asyncpg)
      - DATABASE_URL=postgresql+asyncpg://forevim:securepassword@db-server-ip:5432/forevim_db
      # 2. Security Key (Ganti dengan string random hex panjang, misal: openssl rand -hex 32)
      - SECRET_KEY=generate_your_own_secure_random_key_here
      # 3. CORS Allowed Origins (Bisa disamakan dengan alamat akses frontend/nginx)
      - ALLOWED_ORIGINS_STR=http://localhost:80,http://127.0.0.1:80
      # 4. Akses URL di Browser Pengguna (PENTING: Ganti localhost ke IP/Domain Publik Server Anda)
      - NEXT_PUBLIC_API_URL=http://localhost:80/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:80
    ports:
      - "80:80"
    networks:
      - forevim-net
    healthcheck:
      # Exposes /health through Nginx, which proxies to Backend /health
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ──────────────────────────────────────────────────────────────────────────────
