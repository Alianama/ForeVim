version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# ForeVim — Production Deployment Compose (Unified Single Image)
# Before running:
# 1. Copy .env.example to .env and configure DATABASE_URL and external variables.
# 2. Run: docker compose -f docker-compose.prod.yml up -d
# ──────────────────────────────────────────────────────────────────────────────

networks:
  forevim-net:
    driver: bridge

services:
  # ─── ForeVim (Unified Frontend, Backend, & Nginx) ───────────────────────────
  forevim:
    image: ghcr.io/alianama/forevim:latest
    container_name: forevim-app
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS_STR=${ALLOWED_ORIGINS_STR:-http://localhost:3000,http://localhost:80}
      # Browser runtime configurations (dynamically injected into built static files at container start)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:80/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:80}
    ports:
      - "80:80"
    networks:
      - forevim-net
    healthcheck:
      # Exposes /health through Nginx, which proxies to Backend /health
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

